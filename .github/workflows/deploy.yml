name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Derive access password hash
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          if [ -z "$ACCESS_PASSWORD" ]; then
            echo "::error::ACCESS_PASSWORD secret is not set. Set it in repository settings, or the site would deploy without the access gate."
            exit 1
          fi
          echo "VITE_ACCESS_PW_HASH=$(node scripts/hash-password.mjs)" >> "$GITHUB_ENV"

      - run: npm run build
      - run: npm run docs:build
      - run: cp -r dist-docs dist/docs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
